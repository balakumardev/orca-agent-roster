<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Agent Roster</title>
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <header class="head">
      <div class="head-top">
        <h1 class="title">Agent Roster</h1>
        <button id="refresh" class="icon-btn" type="button" aria-label="Refresh the list" title="Refresh">
          <svg viewBox="0 0 16 16" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9" />
            <path d="M13.6 2.4v3.3h-3.3" />
          </svg>
        </button>
      </div>
      <div class="head-bottom">
        <span id="group-label" class="muted">Group by</span>
        <div class="seg" role="group" aria-labelledby="group-label">
          <button type="button" data-mode="status" aria-pressed="true">Status</button>
          <button type="button" data-mode="worktree" aria-pressed="false">Worktree</button>
        </div>
      </div>
    </header>
    <div id="note" class="note" role="status" aria-live="polite" hidden></div>
    <main id="list" class="list" aria-busy="true">
      <p class="empty">Loading agents&hellip;</p>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
